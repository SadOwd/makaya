<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 NEON RIDE - Interface Ultra-Moderne</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Fonts personnalisés */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        /* Animation personnalisée pour le texte du logo */
        @keyframes gradient-shift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }
        
        /* Scrollbar personnalisée */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #06b6d4, #a855f7);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #0891b2, #9333ea);
        }
    </style>
</head>
<body class="bg-black">
    <!-- Conteneur principal -->
    <div id="root"></div>
    
    <!-- React et Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Votre composant React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Wrapper pour Lucide Icons
        const Icon = ({ name, ...props }) => {
            const ref = useRef(null);
            
            useEffect(() => {
                if (ref.current) {
                    lucide.createIcons({
                        icons: { [name]: lucide[name] },
                        attrs: props,
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name]);
            
            return <i ref={ref} data-lucide={name} {...props} />;
        };

        // === COPIEZ ICI LE CONTENU COMPLET DU FICHIER FUSIONNÉ ===
        // Ou importez-le via un module si vous utilisez un bundler
        
        const NeonUberInterface = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [menuOpen, setMenuOpen] = useState(false);
            const [selectedLocation, setSelectedLocation] = useState(null);
            const [tripStatus, setTripStatus] = useState('idle');
            const [driverInfo, setDriverInfo] = useState(null);
            const [notifications, setNotifications] = useState(3);
            const mapRef = useRef(null);

            useEffect(() => {
                const canvas = document.getElementById('neon-canvas');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                for (let i = 0; i < 50; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 2
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                    
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    requestAnimationFrame(animate);
                }
                animate();
            }, []);

            const simulateTrip = () => {
                setTripStatus('searching');
                setTimeout(() => {
                    setTripStatus('found');
                    setDriverInfo({
                        name: 'Alexandre Martin',
                        rating: 4.9,
                        car: 'Tesla Model 3',
                        plate: 'AB-123-CD',
                        eta: '3 min'
                    });
                }, 2000);
            };

            return (
                <div className="relative w-full h-screen bg-black overflow-hidden">
                    <canvas id="neon-canvas" className="absolute inset-0 pointer-events-none opacity-30" />
                    
                    <header className="absolute top-0 left-0 right-0 z-50 bg-gradient-to-b from-black/80 to-transparent backdrop-blur-sm">
                        <div className="flex items-center justify-between p-4">
                            <button onClick={() => setMenuOpen(true)} className="p-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30 hover:bg-cyan-500/20 transition-all">
                                <Icon name="menu" className="w-6 h-6 text-cyan-400" />
                            </button>
                            
                            <div className="text-2xl font-bold">
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 animate-gradient">
                                    NEON RIDE
                                </span>
                            </div>
                            
                            <button className="relative p-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30 hover:bg-cyan-500/20 transition-all">
                                <Icon name="bell" className="w-6 h-6 text-cyan-400" />
                                {notifications > 0 && (
                                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-pink-500 rounded-full text-xs flex items-center justify-center text-white font-bold animate-bounce">
                                        {notifications}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    <div className="absolute inset-0">
                        <div className="w-full h-full bg-gradient-to-br from-gray-900 via-gray-800 to-black relative">
                            <div className="absolute inset-0 opacity-20">
                                {[...Array(20)].map((_, i) => (
                                    <div key={`h-${i}`} className="absolute w-full h-px bg-gradient-to-r from-transparent via-cyan-500 to-transparent" style={{ top: `${i * 5}%` }} />
                                ))}
                                {[...Array(20)].map((_, i) => (
                                    <div key={`v-${i}`} className="absolute h-full w-px bg-gradient-to-b from-transparent via-cyan-500 to-transparent" style={{ left: `${i * 5}%` }} />
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 z-40">
                        <div className="bg-gradient-to-t from-black via-gray-900/95 to-transparent backdrop-blur-xl border-t border-cyan-500/30 rounded-t-3xl shadow-2xl shadow-cyan-500/20">
                            <div className="p-6 space-y-4">
                                <h2 className="text-white text-2xl font-bold mb-4">Où allez-vous ?</h2>
                                
                                <div className="relative">
                                    <Icon name="map-pin" className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-cyan-400" />
                                    <input
                                        type="text"
                                        placeholder="Adresse de départ"
                                        className="w-full pl-12 pr-4 py-4 bg-gray-800/50 border border-cyan-500/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>

                                <button
                                    onClick={simulateTrip}
                                    className="w-full py-4 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 rounded-xl text-white font-bold text-lg hover:scale-105 transition-all"
                                >
                                    Rechercher un chauffeur
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Rendu
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NeonUberInterface />);
    </script>
    
    <!-- Script d'initialisation des icônes Lucide -->
    <script>
        // Initialiser les icônes Lucide après le chargement
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
